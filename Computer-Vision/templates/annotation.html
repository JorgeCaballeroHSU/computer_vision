<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Bildanmerkung</title>

        <style>
            body {
                margin: 0;
                font-family: Arial, sans-serif;
                display: flex;
                height: 100vh;
                background: #f4f4f4;
            }

            /* ===== SIDEBAR ===== */
            #sidebar {
                width: 220px;
                background: #8a1538;
                color: white;
                overflow-y: auto;
                padding: 10px;
            }

            .thumbnail {
                width: 100%;
                cursor: pointer;
                margin-bottom: 10px;
                border: 2px solid transparent;
            }

            .thumbnail:hover {
                border: 2px solid white;
            }

            /* ===== MAIN ===== */
            #main {
                flex: 1;
                display: flex;
                flex-direction: column;
            }

            /* HEADER */
            header {
                display: flex;
                align-items: center;
                background: white;
                padding: 10px;
                border-bottom: 1px solid #ccc;
            }

            header h1 {
                text-align: center;
                flex: 1;
            }
            header img {
                height: 70px;
                margin-right: 10px;
                margin-left: 10px;
            }


            /* IMAGE AREA */
            #viewer {
                flex: 1;
                display: flex;
                justify-content: center;
                align-items: center;
                background: #ddd;
            }

            #viewer img {
                max-width: 90%;
                max-height: 90%;
            }

            /* CONTROLS */
            #controls {
                padding: 10px;
                background: white;
                border-top: 1px solid #ccc;
            }

            button {
                padding: 8px 12px;
                margin-right: 5px;
                background: #8a1538;
                color: white;
                border: none;
                cursor: pointer;
            }

            button:hover {
                background: #a61d46;
            }

            /* METADATA */
            #metadata {
                font-size: 14px;
                margin-top: 5px;
            }

            /* FORM */
            #form {
                display: none;
                margin-top: 10px;
            }

            input, textarea {
                width: 100%;
                margin-bottom: 8px;
            }

            /*=== RIGHT SIDEBAR ===*/
            
            #rightSidebar {
                position: fixed;
                top: 0;
                right: -400px; /* hidden initially */
                width: 400px;
                height: 100%;
                background: #fff;
                box-shadow: -2px 0 5px rgba(0,0,0,0.3);
                transition: right 0.3s ease;
                z-index: 1000;
            }

            #rightSidebar.open {
                right: 0;
            }

            .sidebar-content {
                padding: 20px;
            }

            .close-btn {
                cursor: pointer;
                float: right;
                font-size: 20px;
            }

        </style>

        <!-- EXIF -->
        <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>

        <script>
        let files = [];
        let index = 0;
        let directoryHandle = null;


        /* ===== CREATE SPACE FOR FORMS =====*/
        function rightSideBar(){
            const rightSidebar=document.getElementById()
        }

        /* ===== OPEN FOLDER ===== */
        async function openFolder() {
            directoryHandle = await window.showDirectoryPicker();

            localStorage.setItem("folderAccess", "granted"); // flag

            files = [];

            for await (const entry of directoryHandle.values()) {
                if (entry.kind === "file" && entry.name.match(/\.(jpg|jpeg|png)$/i)) {
                    const file = await entry.getFile();
                    files.push(file);
                }
            }

            showThumbnails();
            index = 0;
            showImage();
        }

        /* ===== LOAD PREVIOUS FOLDER ===== */
        async function tryRestoreFolder() {
            if (localStorage.getItem("folderAccess")) {
                // user must still re-confirm access — browser restriction
                console.log("Folder access previously granted");
            }
        }

        function showThumbnails() {
            const sidebar = document.getElementById("sidebar");
            sidebar.innerHTML = "";

            files.forEach((file, i) => {
                const img = document.createElement("img");
                img.src = URL.createObjectURL(file);
                img.className = "thumbnail";

                img.onclick = () => {
                    index = i;
                    showImage();
                };

                sidebar.appendChild(img);
            });
        }

        /* ===== SHOW IMAGE ===== */
        function showImage() {
            if (files.length === 0) return;

            const file = files[index];
            const img = document.getElementById("mainImage");
            img.src = URL.createObjectURL(file);
        }

        /* ===== NAVIGATION ===== */
        function next() {
            index = (index + 1) % files.length;
            showImage();
        }

        function prev() {
            index = (index - 1 + files.length) % files.length;
            showImage();
        }

        /* ===== FORM ===== */
        function toggleForm() {
            const form = document.getElementById("form");
            form.style.display = (form.style.display === "none") ? "block" : "none";
        }

        tryRestoreFolder();

        /*===== RIGHT SIDEBAR =====*/
        
        const forms = {
        
        
        /*Here goes the configuration of the project as Dataset*/
        form1: `
        <div id="Dataset" title="Dataset">

                Project Name:

            </label>

                    <option value="Fusch"></option>

                    <option value="Kies"></option>
                    <option value="Misch"></option>

            </label>

            <label>
                Created:
                <input type="datetime" placeholder="DD.MM.YYYY">
            </label>

            <label>
                Description:

            </label>

            
            <button id="save">Save</button>
            
        </div>
        `,
        
        /*This is the form to add or modify the camera/setup information -->*/

                <!-- here goes the list of possible iso settings -->
                <datalist id="ISO">

                    <option value="400"></option>

                    <option value="3200"></option>

        /* here goes the material type form*/
        form3: `

            <button id="save">Save</button>

        `,

        /*<!-- This form is to see the name and location of the files -->*/
        form4:`
        <h2>Sample Dataset</h2>

        <div id="Sample" title="Sample">
            
            <label>
                Label:
                <input type="text" placeholder="">
            </label>

            <label>
                File Path:
                <input type="text" placeholder="">
            </label>

            <label>
                Capture Time:
                <input type="datetime" placeholder="">
            </label>

            <button>Save</button>

        </div>`
        };

        
        // Open sidebar with selected form
        function openForm(formName) {
            const sidebar = document.getElementById("rightSidebar");
            const container = document.getElementById("formContainer");

            container.innerHTML = forms[formName] || "<p>Form not found</p>";
            sidebar.classList.add("open");
        }

        // Save button action (you can extend logic here)
        function saveForm() {
            console.log("Form saved!");
        
        // Add your form data handling here

        closeSidebar();
        }

        // Close sidebar
        function closeSidebar() {
            document.getElementById("rightSidebar").classList.remove("open");
        }


        </script>

    </head>

    <body>

        <!-- LEFT SIDEBAR -->
        <div id="sidebar">

        </div>

        <!-- MAIN -->
        <div id="main">

            <header>
                <img src="../static/Geotechnical Department.png">

                <h1>Bildanmerkung</h1>

            <div id="controls">

                <!-- to call dataset form -->

                <!--to call material type form-->

                <!--to call the content of the table Sample-->
                <button onclick="openForm('form4')">Label and Location</button>

            </div>

        <!--RIGHT SIDEBAR-->
        <div id="rightSidebar" class="sidebar">

            <div class="sidebar-content">

                <span class="close-btn" onclick="closeSidebar()">×</span>

                <div id="formContainer"></div>

            </div>

    </body>    
    
    
</html>
`
