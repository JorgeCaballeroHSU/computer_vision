<!DOCTYPE html>

<title>Annotation</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    display: flex;
    height: 100vh;
    background: #f4f4f4;
}

/* ===== SIDEBAR ===== */
#sidebar {
    width: 220px;
    background: #8a1538;
    color: white;
    overflow-y: auto;
    padding: 10px;
}

.thumbnail {
    width: 100%;
    cursor: pointer;
    margin-bottom: 10px;
    border: 2px solid transparent;
}

.thumbnail:hover {

}

/* ===== MAIN ===== */
#main {
    flex: 1;
    display: flex;
    flex-direction: column;
}

/* HEADER */
header {
    display: flex;
    align-items: center;
    background: white;
    padding: 10px;
    border-bottom: 1px solid #ccc;
}

header h1 {
    text-align: center;
    flex: 1;
}
header img {
    height: 70px;
    margin-right: 10px;
    margin-left: 10px;
}


/* IMAGE AREA */
#viewer {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #ddd;
}

#viewer img {
    max-width: 90%;
    max-height: 90%;
}

/* CONTROLS */
#controls {
    padding: 10px;
    background: white;
    border-top: 1px solid #ccc;
}

button {
    padding: 8px 12px;
    margin-right: 5px;
    background: #8a1538;
    color: white;
    border: none;
    cursor: pointer;
}

button:hover {
    background: #a61d46;
}

/* METADATA */
#metadata {
    font-size: 14px;
    margin-top: 5px;
}

/* FORM */
#form {
    display: none;
    margin-top: 10px;
}

input, textarea {
    width: 100%;
    margin-bottom: 8px;
}
</style>
</head>

<!-- EXIF -->
<script src="https://cdn.jsdelivr.net/npm/exif-js"></script>

<script>
let files = [];
let index = 0;
let directoryHandle = null;

/* ===== OPEN FOLDER ===== */
async function openFolder() {
    directoryHandle = await window.showDirectoryPicker();

    localStorage.setItem("folderAccess", "granted"); // flag

    files = [];

    for await (const entry of directoryHandle.values()) {
        if (entry.kind === "file" && entry.name.match(/\.(jpg|jpeg|png)$/i)) {
            const file = await entry.getFile();
            files.push(file);
        }
    }

    showThumbnails();
    index = 0;
    showImage();
}

/* ===== LOAD PREVIOUS FOLDER ===== */
async function tryRestoreFolder() {
    if (localStorage.getItem("folderAccess")) {
        // user must still re-confirm access — browser restriction
        console.log("Folder access previously granted");
    }
}

function showThumbnails() {
    const sidebar = document.getElementById("sidebar");
    sidebar.innerHTML = "";

    files.forEach((file, i) => {
        const img = document.createElement("img");
        img.src = URL.createObjectURL(file);
        img.className = "thumbnail";

        img.onclick = () => {
            index = i;
            showImage();
        };

        sidebar.appendChild(img);
    });
}

/* ===== SHOW IMAGE ===== */
function showImage() {
    if (files.length === 0) return;

    const file = files[index];
    const img = document.getElementById("mainImage");
    img.src = URL.createObjectURL(file);

    img.onload = function () {
        EXIF.getData(img, function () {
            const make = EXIF.getTag(this, "Make");
            const model = EXIF.getTag(this, "Model");
            const focal = EXIF.getTag(this, "FocalLength");

            document.getElementById("metadata").innerHTML =
                `Camera: ${make || "-"} ${model || ""} | Focal: ${focal || "-"}`;
        });
    };
}

/* ===== NAVIGATION ===== */
function next() {
    index = (index + 1) % files.length;
    showImage();
}

function prev() {
    index = (index - 1 + files.length) % files.length;
    showImage();
}

/* ===== FORM ===== */
function toggleForm() {
    const form = document.getElementById("form");
    form.style.display = (form.style.display === "none") ? "block" : "none";
}

tryRestoreFolder();
</script>

</body>
</html>
